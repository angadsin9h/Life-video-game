<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LifeQuest – Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .icon { font-size: 4rem; margin-bottom: 1.5rem; }
    h1 { font-size: 1.5rem; font-weight: 700; color: #7c3aed; margin-bottom: 0.75rem; }
    p { color: #94a3b8; font-size: 0.95rem; line-height: 1.6; max-width: 320px; }
    .sub { margin-top: 0.5rem; font-size: 0.8rem; color: #475569; }
    button {
      margin-top: 2rem;
      padding: 0.75rem 2rem;
      background: #7c3aed;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="icon">⚔️</div>
  <h1>You're Offline</h1>
  <p>Your data is safe — LifeQuest stores everything locally on your device.</p>
  <p class="sub">Reconnect to load the full app.</p>
  <button onclick="location.reload()">Try Again</button>
</body>
</html>
